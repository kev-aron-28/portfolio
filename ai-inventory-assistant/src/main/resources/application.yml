spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ai-inventory-assistant
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:inventory}
    username: ${POSTGRES_USER:inventory}
    password: ${POSTGRES_PASSWORD:inventory}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

app:
  assistant:
    write-tools-enabled: ${ASSISTANT_WRITE_TOOLS_ENABLED:false}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:}
