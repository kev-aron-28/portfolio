<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <div class="page-header">
    <div>
      <h1 class="page-title" th:text="${pageTitle}">Vision Board</h1>
      <p class="page-subtitle">Name the horizon you are designing.</p>
    </div>
    <a class="btn btn-outline-secondary" th:href="${boardId != null} ? @{/vision/{id}(id=${boardId})} : @{/vision}">
      <i class="bi bi-arrow-left me-1"></i>Back
    </a>
  </div>

  <div class="card-surface p-4" style="max-width: 520px;">
    <form th:action="${formAction}" th:object="${boardForm}" method="post" novalidate>
      <div class="mb-3">
        <label for="title" class="form-label">Title</label>
        <input type="text" id="title" class="form-control"
               th:classappend="${#fields.hasErrors('title')} ? ' is-invalid'"
               th:field="*{title}"
               placeholder="e.g. Become who I am building" required>
        <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
      </div>

      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea id="description" class="form-control" rows="3"
                  th:classappend="${#fields.hasErrors('description')} ? ' is-invalid'"
                  th:field="*{description}"
                  placeholder="One sentence about this horizon."></textarea>
        <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
      </div>

      <div class="form-check mb-4" th:if="${boardId == null}">
        <input class="form-check-input" type="checkbox" id="useDemoTemplate"
               th:field="*{useDemoTemplate}">
        <label class="form-check-label" for="useDemoTemplate">
          Start with the inspirational demo roadmap (visions, milestones, skill tree)
        </label>
      </div>
      <input type="hidden" th:if="${boardId != null}" th:field="*{useDemoTemplate}">

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Save</button>
        <a class="btn btn-outline-secondary"
           th:href="${boardId != null} ? @{/vision/{id}(id=${boardId})} : @{/vision}">Cancel</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
